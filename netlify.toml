[build]
  command = "npm run generate:sitemap && npx ng build --configuration=production --base-href=/"
  publish = "dist/halima-website/browser"

[build.environment]
  NODE_VERSION = "20"
  SITE_URL = "https://halima-website.netlify.app"

# Prerendered routes are served as static files first.
# This fallback covers client-side navigation / deep links without a matching file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
