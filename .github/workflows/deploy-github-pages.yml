name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          SITE_URL: https://zeyadMohsenHegazy.github.io/HalimaWebsite
        run: |
          npm run generate:sitemap
          npx ng build --configuration=production --base-href=/HalimaWebsite/

      - name: Prepare Pages files
        run: |
          touch dist/halima-website/browser/.nojekyll
          cp dist/halima-website/browser/index.html dist/halima-website/browser/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/halima-website/browser
          force_orphan: true
          enable_jekyll: false
