# Halima Angular site — Nginx configuration
# Copy to: /etc/nginx/sites-available/halima.conf
# Enable: sudo ln -s /etc/nginx/sites-available/halima.conf /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name www.halima.com halima.com;

    # Redirect HTTP to HTTPS (uncomment after SSL is configured)
    # return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.halima.com halima.com;

    # SSL certificates (Let's Encrypt / your provider)
    # ssl_certificate     /etc/letsencrypt/live/halima.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/halima.com/privkey.pem;

    root /var/www/halima/browser;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Cache hashed static assets (Angular outputHashing)
    location ~* \.(?:js|css|woff2?|png|jpe?g|webp|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # i18n and product JSON — short cache
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Prerendered Angular routes
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # robots.txt and sitemap from public/
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
}

